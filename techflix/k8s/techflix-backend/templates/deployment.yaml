apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "techflix-backend.fullname" . }}
  labels:
    {{- include "techflix-backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "techflix-backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "techflix-backend.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.targetPort }}
        env:
        - name: MONGO_HOST
          value: {{ .Values.mongodb.host | quote }}
        - name: MONGO_PORT
          value: {{ .Values.mongodb.port | quote }}
        - name: MONGO_DB
          value: {{ .Values.mongodb.database | quote }}
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.mongodb.secretName | quote }}
              key: {{ .Values.mongodb.secretKey | quote }}
              optional: true