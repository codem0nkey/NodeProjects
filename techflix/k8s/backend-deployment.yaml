apiVersion: apps/v1
kind: Deployment
metadata:
  name: techflix-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: techflix-backend
  template:
    metadata:
      labels:
        app: techflix-backend
    spec:
      containers:
      - name: techflix-backend
        image: marcdavis25/techflix-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: MONGO_HOST
          value: "mongo-mongodb.default.svc.cluster.local"
        - name: MONGO_PORT
          value: "27017"
        - name: MONGO_DB
          value: "techflix"
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongo-mongodb
              key: mongodb-root-password
              optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: techflix-backend-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: techflix-backend
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
    nodePort: 30500
