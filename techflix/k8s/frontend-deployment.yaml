apiVersion: apps/v1
kind: Deployment
metadata:
  name: techflix-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: techflix-frontend
  template:
    metadata:
      labels:
        app: techflix-frontend
    spec:
      containers:
      - name: techflix-frontend
        image: marcdavis25/techflix-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: techflix-frontend-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: techflix-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30080
