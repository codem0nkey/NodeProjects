apiVersion: v1
kind: Service
metadata:
  name: {{ include "techflix-backend.fullname" . }}-service
  labels:
    {{- include "techflix-backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - protocol: TCP
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
    {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
    nodePort: {{ .Values.service.nodePort }}
    {{- end }}
  selector:
    {{- include "techflix-backend.selectorLabels" . | nindent 4 }}